<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>律人研究所</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#1e293b;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#172b4d;color:white;padding:25px 18px}header small{letter-spacing:2px;color:#a9c8ef}header h1{margin:9px 0 4px}main{max-width:750px;margin:auto;padding:15px}.card{background:white;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 15px #152b4a12}h2{font-size:19px;margin:0 0 14px}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:white}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:9px;padding:11px 14px;background:#265fa5;color:white;font-weight:650;font-size:15px;cursor:pointer}button.secondary{background:#e8eef6;color:#1d3b61}button.danger{background:#fff0f0;color:#a32121}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#64748b;font-size:13px;line-height:1.6}.entry{border-top:1px solid #e2e8f0;padding:15px 0}.entry:first-child{border-top:0}.tags{color:#2861a3;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fa;padding:12px;border-radius:9px;font-size:13px}audio{width:100%;margin-top:8px}.hidden{display:none}footer{text-align:center;padding:10px 15px 30px;color:#64748b;font-size:12px}</style></head><body><header><small>RITSUTO LAB · VER 0.1</small><h1>🔬 律人研究所</h1><div>親子の会話を、発見と次の問いにつなげる。</div></header><main><section class="card"><h2>研究記録をつける</h2><input type="hidden" id="editId"><label for="date">日付 *</label><input id="date" type="date"><label for="theme">テーマ</label><input id="theme" placeholder="例：栗のイガはなぜあるの？"><label for="conversation">会話・文字起こし *</label><textarea id="conversation" placeholder="律人：…&#10;ママ：…"></textarea><label for="question">ママの気になる点</label><textarea id="question" placeholder="本当なのかな？ 次に聞いてみたいことは？"></textarea><label for="audio">録音ファイル（任意・保存されません）</label><input id="audio" type="file" accept="audio/*"><audio id="player" controls class="hidden"></audio><p class="muted">録音はこの画面で再生できますが、記録に添付保存されません。文字起こしは手動で貼り付けてください。</p><div class="actions"><button id="save">記録を保存</button><button id="clear" class="secondary">入力をクリア</button></div></section><section class="card"><h2>AI検証の依頼文</h2><p class="muted">現在の入力内容からChatGPTに貼り付ける依頼文を作ります。AIによる自動検証はまだありません。</p><div class="actions"><button id="generate">検証依頼を作成</button><button id="copy" class="secondary">依頼文をコピー</button><button id="openChat" class="secondary">ChatGPTを開く</button></div><pre id="prompt" class="hidden"></pre></section><section class="card"><h2>研究ノート <span id="count">0件</span></h2><div id="entries"></div></section><section class="card"><h2>バックアップ</h2><p class="muted">データはこのブラウザ内に保存されます。Safariのデータ消去などで失われる可能性があります。定期的にJSONを保存してください。</p><div class="actions"><button id="export">JSONを書き出す</button><label for="import" style="margin:0"><span style="display:inline-block;padding:11px 14px;border-radius:9px;background:#e8eef6;color:#1d3b61;font-weight:650">JSONを読み込む</span></label><input id="import" type="file" accept=".json,application/json" class="hidden"></div></section></main><footer>律人研究所 · 人ではなく、事実と考え方を検証する</footer><script>
const KEY='ritsuto-lab-v1';const $=id=>document.getElementById(id);let records=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))records=x}catch(e){alert('保存データを読み込めませんでした。')}const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').value=today();let audioURL=null;
function saveStore(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('保存できませんでした。ブラウザの空き容量や設定を確認してください。');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tags(s){return [['自然・科学',/虫|動物|植物|栗|宇宙|星|水|魚|天気|科学/],['暮らし',/学校|家|料理|食べ|友達|先生|生活/],['数・しくみ',/数|計算|時間|なぜ|どうして|仕組み|しくみ/],['気持ち・社会',/気持ち|嬉し|悲し|怒|人|約束|社会/]].filter(x=>x[1].test(s)).map(x=>x[0])}
function reset(){['editId','theme','conversation','question','audio'].forEach(id=>$(id).value='');$('date').value=today();$('save').textContent='記録を保存';$('player').classList.add('hidden');if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null}
function render(){const list=$('entries');$('count').textContent=records.length+'件';list.innerHTML=records.length?'':'<p class="muted">まだ記録がありません。最初の会話を登録してみましょう。</p>';records.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{const d=document.createElement('div');d.className='entry';d.innerHTML=`<strong>${esc(r.date)} · ${esc(r.theme||'テーマ未設定')}</strong><div class="tags">${esc(tags((r.theme||'')+' '+r.conversation).join(' / ')||'自由研究')}</div><p>${esc(r.conversation).replace(/\n/g,'<br>')}</p>${r.question?`<p class="muted">気になる点：${esc(r.question)}</p>`:''}<div class="actions"><button class="secondary" data-action="edit">編集</button><button class="danger" data-action="delete">削除</button></div>`;d.querySelector('[data-action=edit]').onclick=()=>{['date','theme','conversation','question'].forEach(k=>$(k).value=r[k]||'');$('editId').value=r.id;$('save').textContent='変更を保存';window.scrollTo({top:0,behavior:'smooth'})};d.querySelector('[data-action=delete]').onclick=()=>{if(confirm('この記録を削除しますか？')){const old=records;records=records.filter(x=>x.id!==r.id);if(!saveStore())records=old;render()}};list.appendChild(d)})}
$('save').onclick=()=>{const date=$('date').value,conversation=$('conversation').value.trim();if(!date||!conversation){alert('日付と会話は必須です。');return}const id=$('editId').value||('r'+Date.now()+'-'+Math.random().toString(36).slice(2));const r={id,date,theme:$('theme').value.trim(),conversation,question:$('question').value.trim()};const old=records.slice();records=records.filter(x=>x.id!==id);records.push(r);if(saveStore()){reset();render();alert('保存しました！')}else records=old};$('clear').onclick=reset;
$('audio').onchange=()=>{if(audioURL)URL.revokeObjectURL(audioURL);const f=$('audio').files[0];if(f){audioURL=URL.createObjectURL(f);$('player').src=audioURL;$('player').classList.remove('hidden')}else $('player').classList.add('hidden')};
function promptText(){const conv=$('conversation').value.trim();if(!conv){alert('先に会話を入力してください。');return ''}const theme=$('theme').value.trim();return `あなたは親子の探究学習を支援するアシスタントです。子ども自身を評価せず、発言の事実と推論を丁寧に検証してください。\n\n日付：${$('date').value}\nテーマ：${theme||'未設定'}\n推定カテゴリ：${tags(theme+' '+conv).join('、')||'自由研究'}\n\n【会話】\n${conv}\n\n【親の疑問】\n${$('question').value.trim()||'特になし'}\n\n次の5項目を簡潔に整理してください。\n1. 事実確認（確かなこと・不確かなことを分ける）\n2. 子どもの考え方や推論の筋道（決めつけずに）\n3. 親向けの背景知識\n4. 小学1年生に伝わる説明例\n5. 次回の会話で使える自然な質問を最大2つ\n\n根拠が曖昧な内容は断定せず、必要なら調べるべき点を示してください。`}
$('generate').onclick=()=>{const p=promptText();if(p){$('prompt').textContent=p;$('prompt').classList.remove('hidden')}};$('copy').onclick=async()=>{const p=$('prompt').textContent||promptText();if(!p)return;try{await navigator.clipboard.writeText(p);alert('コピーしました！')}catch(e){$('prompt').textContent=p;$('prompt').classList.remove('hidden');alert('自動コピーできませんでした。表示された文章を長押ししてコピーしてください。')}};$('openChat').onclick=()=>window.open('https://chatgpt.com/','_blank');
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'ritsuto-lab',version:1,records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ritsuto-lab-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$('import').onchange=async()=>{const f=$('import').files[0];if(!f)return;try{const obj=JSON.parse(await f.text());const arr=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(arr)||!arr.every(r=>r&&typeof r.id==='string'&&typeof r.date==='string'&&typeof r.conversation==='string'))throw Error('形式が違います');if(!confirm('現在の記録をバックアップの内容で置き換えますか？'))return;const old=records;records=arr.map(r=>({id:r.id,date:r.date,theme:String(r.theme||''),conversation:r.conversation,question:String(r.question||'')}));if(!saveStore())records=old;render();alert('復元しました')}catch(e){alert('読み込みに失敗しました：'+e.message)}finally{$('import').value=''}};render();
</script></body></html>
